name: Build Windows

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_x86:
        description: "Also build 32-bit x86 (needed for 32-bit J2534 DLLs)"
        type: boolean
        default: false

jobs:

  ##############################################################################
  # 64-bit build (MinGW-w64 / Qt5, via MSYS2)
  ##############################################################################
  build:
    name: Windows ${{ matrix.arch }} (${{ matrix.msystem }}, Qt5)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            msystem: MINGW64
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 toolchain + Qt5
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: >-
            toolchain:p
            qt5-base:p
            qt5-tools:p
            make:p

      - name: Locate toolchain
        run: |
          CC_BIN="$(command -v gcc || command -v clang)"
          "$CC_BIN" --version 2>&1 | sed -n 1p

          QMAKE="$(command -v qmake-qt5 || command -v qmake || echo $MINGW_PREFIX/share/qt5/bin/qmake.exe)"
          [ -x "$QMAKE" ] || { echo "qmake not found"; exit 1; }
          "$QMAKE" --version

          # The real Qt5 tool binaries live in QT_INSTALL_BINS. The $MINGW_PREFIX/bin/*-qt5
          # wrappers are not reliable: lrelease-qt5 looks for lrelease.exe next to
          # itself, where it does not exist.
          QTBIN_RAW="$("$QMAKE" -query QT_INSTALL_BINS)"
          QTBIN="$(cygpath -u "$QTBIN_RAW" 2>/dev/null || echo "$QTBIN_RAW")"
          echo "QT_INSTALL_BINS=$QTBIN"

          find_tool() {
            local n="$1" c
            for c in "$QTBIN/$n.exe" "$MINGW_PREFIX/share/qt5/bin/$n.exe" "$MINGW_PREFIX/bin/$n-qt5" "$MINGW_PREFIX/bin/$n.exe"; do
              [ -x "$c" ] && { echo "$c"; return 0; }
            done
            return 1
          }

          LRELEASE="$(find_tool lrelease)" || { echo "lrelease not found"; exit 1; }
          "$LRELEASE" -version

          MAKE="$(command -v mingw32-make || command -v make)" || { echo "make not found"; exit 1; }
          WDQ="$(find_tool windeployqt || true)"
          [ -n "$WDQ" ] || echo "note: windeployqt unavailable, the Qt runtime will be copied manually"

          { echo "QMAKE=$QMAKE"; echo "LRELEASE=$LRELEASE"; echo "MAKE=$MAKE"; echo "WDQ=$WDQ"; } >> "$GITHUB_ENV"

      - name: Configure (qmake)
        run: |
          "$QMAKE" FreeSSM.pro

      - name: Compile (release)
        run: |
          "$MAKE" -j"$(nproc)" release

      - name: Compile translations (.qm)
        run: |
          # NOTE: do not pass the .pro file. Qt's lrelease then re-invokes itself
          # through a hardcoded $QT_INSTALL_BINS/lrelease.exe, which MSYS2 does not
          # ship (it installs lrelease-qt5.exe). Compiling the .ts files directly
          # avoids that and produces exactly the same .qm files.
          for ts in FreeSSM_*.ts; do
            "$LRELEASE" "$ts" -qm "${ts%.ts}.qm"
          done
          ls -la FreeSSM_*.qm

      - name: Stage distribution tree
        run: |
          set -euo pipefail
          DIST=dist/FreeSSM
          mkdir -p "$DIST/doc" "$DIST/definitions"
          cp FreeSSM.exe              "$DIST/"
          cp background.png           "$DIST/"
          cp LiberationSans*.ttf      "$DIST/"
          cp FreeSSM_*.qm             "$DIST/"
          cp README.txt LICENSE.txt   "$DIST/"
          cp doc/*                    "$DIST/doc/"
          cp definitions/SSM1defs_*.xml "$DIST/definitions/"

      - name: Deploy Qt + MinGW runtime
        run: |
          set -euo pipefail
          DIST=dist/FreeSSM

          QTPLUG_RAW="$("$QMAKE" -query QT_INSTALL_PLUGINS)"
          QTPLUG="$(cygpath -u "$QTPLUG_RAW" 2>/dev/null || echo "$QTPLUG_RAW")"

          # --no-angle: MSYS2 builds Qt5 against desktop OpenGL and ships no
          # libGLESv2.dll, which windeployqt otherwise treats as a fatal error.
          if [ -n "${WDQ:-}" ]; then
            "$WDQ" --release --no-translations --no-system-d3d-compiler \
                   --no-opengl-sw --no-angle "$DIST/FreeSSM.exe" \
              || echo "windeployqt failed, continuing with the manual copy below"
          fi

          # Safety net: make sure the essentials are present whatever windeployqt did.
          for dll in Qt5Core Qt5Gui Qt5Widgets Qt5PrintSupport; do
            [ -e "$DIST/$dll.dll" ] || cp "$MINGW_PREFIX/bin/$dll.dll" "$DIST/"
          done
          if [ ! -e "$DIST/platforms/qwindows.dll" ]; then
            mkdir -p "$DIST/platforms"
            cp "$QTPLUG/platforms/qwindows.dll" "$DIST/platforms/"
          fi
          mkdir -p "$DIST/styles" "$DIST/imageformats"
          [ -n "$(ls -A "$DIST/styles" 2>/dev/null)" ] \
            || cp "$QTPLUG"/styles/*.dll "$DIST/styles/" 2>/dev/null || true
          [ -n "$(ls -A "$DIST/imageformats" 2>/dev/null)" ] \
            || cp "$QTPLUG"/imageformats/*.dll "$DIST/imageformats/" 2>/dev/null || true

          # MSYS2's Qt links third-party libs (pcre2, harfbuzz, zlib, ...) and the
          # compiler runtime dynamically, and windeployqt does not follow those.
          # Resolve the full import closure with objdump and copy everything that
          # lives in $MINGW_PREFIX.
          changed=1
          while [ "$changed" -eq 1 ]; do
            changed=0
            deps="$(find "$DIST" -type f \( -name '*.exe' -o -name '*.dll' \) -print0 \
                    | xargs -0 -r objdump -p 2>/dev/null \
                    | awk '/DLL Name:/ {print $3}' | sort -u)"
            for name in $deps; do
              if [ ! -e "$DIST/$name" ] && [ -e "$MINGW_PREFIX/bin/$name" ]; then
                cp "$MINGW_PREFIX/bin/$name" "$DIST/"
                changed=1
              fi
            done
          done

          echo "--- unresolved (expected: Windows system DLLs only) ---"
          find "$DIST" -type f \( -name '*.exe' -o -name '*.dll' \) -print0 \
            | xargs -0 -r objdump -p 2>/dev/null \
            | awk '/DLL Name:/ {print $3}' | sort -u \
            | while read -r n; do
                [ -e "$DIST/$n" ] || [ -e "$MINGW_PREFIX/bin/$n" ] || echo "  system: $n"
              done
          echo "--- package contents ---"
          ls -la "$DIST"

      - name: Smoke test (must load every DLL and exit 0)
        run: |
          set -euo pipefail
          cd dist/FreeSSM
          ./FreeSSM.exe --help
          echo "exit code: $? (0 = all dependencies resolved)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeSSM-windows-${{ matrix.arch }}
          path: dist/FreeSSM
          if-no-files-found: error

  ##############################################################################
  # 32-bit build - opt-in. A 32-bit FreeSSM.exe runs fine on 64-bit Windows and
  # is the ONLY way to use the 32-bit J2534 DLLs that most vendors ship.
  ##############################################################################
  win32:
    name: Windows x86 32-bit (MinGW 8.1, Qt 5.15.2)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_x86 }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 5.15.2 (win32_mingw81) + MinGW 8.1.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win32_mingw81
          tools: 'tools_mingw,qt.tools.win32_mingw810'
          add-tools-to-path: true
          cache: true

      - name: Build
        shell: cmd
        run: |
          qmake FreeSSM.pro
          mingw32-make -j2 release
          lrelease FreeSSM.pro

      - name: Stage distribution tree
        shell: bash
        run: |
          set -euo pipefail
          DIST=dist/FreeSSM
          mkdir -p "$DIST/doc" "$DIST/definitions"
          cp FreeSSM.exe "$DIST/"
          cp background.png LiberationSans*.ttf FreeSSM_*.qm README.txt LICENSE.txt "$DIST/"
          cp doc/* "$DIST/doc/"
          cp definitions/SSM1defs_*.xml "$DIST/definitions/"

      - name: Deploy Qt + MinGW runtime
        shell: cmd
        run: windeployqt --release --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw dist\FreeSSM\FreeSSM.exe

      - name: Smoke test
        shell: cmd
        working-directory: dist/FreeSSM
        run: FreeSSM.exe --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeSSM-windows-x86-32bit
          path: dist/FreeSSM
          if-no-files-found: error
